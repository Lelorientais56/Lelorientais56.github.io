cmP=()=>{const v=visP();let p=v.find(x=>x.id==CM.pid);if(!p){p=v.find(x=>(x.name||'').toLowerCase().startsWith('lili'))||v.find(x=>x.id==me.id)||v[0];CM.pid=p?p.id:''}return p},
cmKeys=m=>{const d=cmDays(m),k=new Set();for(let i=-7;i<=7;i+=7){k.add(plk(dAdd(d[0],i)));k.add(plk(dAdd(d[d.length-1],-i)))}return[...k]},
cmMon=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})},
cmKind=d=>{const f=hol(+d.slice(0,4))[d.slice(5)];return f&&f.k=='f'?'f':wd(d)==6?'d':'n'};
function cmCalc(p){const m=CM.m,days=cmDays(m),ctr=Math.round((num(p.hrs)||35)*60),ft=ctr>=2100,H1=num(CM.h1)/100,H2=num(CM.h2)/100,wks=[...new Set(days.map(d=>mon(d)))];
 let tot=0,sun=0,fer=0,hs1=0,hs2=0,part=0;const W=wks.map(w=>{const all=Array.from({length:7},(_,i)=>dAdd(w,i)),inM=all.filter(d=>d.startsWith(m)),wm=all.reduce((s,d)=>s+gm(p.id,d),0),mm=inM.reduce((s,d)=>s+gm(p.id,d),0),full=inM.length==7,over=Math.max(0,wm-ctr),a=ft?Math.min(over,480):0,b=ft?over-a:0;
  inM.forEach(d=>{const x=gm(p.id,d),k=cmKind(d);if(k=='f')fer+=x;else if(k=='d')sun+=x});tot+=mm;if(full){hs1+=a;hs2+=b}else part++;
  return {w,all,inM,wm,mm,full,over,a,b}});
 const norm=tot-sun-fer,paid=norm/60+sun/60*mu('d')+fer/60*mu('f')+hs1/60*H1+hs2/60*H2,r=num(CM.rate),cm=ctr*52/12/60;
 return {W,tot,sun,fer,hs1,hs2,part,paid,brut:r?paid*r:0,r,ctr,ft,cm,ecart:tot-cm*60,H1,H2}}
function cmSumHtml(p){const c=cmCalc(p),dec=m=>n2(m/60),row=(a,b)=>`<tr><td>${a}<td style="text-align:right"><b>${b}</b>`;
 return `<table class="cmt"><tr><th>Semaine<th>Heures<th>Décimal<th>Contrat<th>Écart<th>H. sup.</tr>${c.W.map(x=>`<tr><td>${fd(x.inM[0])} → ${fd(x.inM[x.inM.length-1])}${x.full?'':' <small>(à cheval)</small>'}<td><b>${hm(x.mm)}</b><td>${dec(x.mm)}<td>${hm(c.ctr)}<td>${x.full?(x.wm>=c.ctr?'+':'−')+hm(Math.abs(x.wm-c.ctr)):'–'}<td>${x.full&&x.over?(c.ft?hm(x.a)+(x.b?' + '+hm(x.b):''):hm(x.over)):''}`).join('')}</table>
<table class="cmt" style="margin-top:10px">${row('Heures faites ce mois (base 60 min)',hm(c.tot)+' = '+dec(c.tot)+' h')}${row('Heures du contrat sur le mois ('+n2(c.ctr/60)+' h × 52 ÷ 12)',n2(c.cm)+' h')}${row('Écart avec le contrat',(c.ecart>=0?'+':'−')+hm(Math.abs(Math.round(c.ecart)))+' = '+(c.ecart>=0?'+':'−')+n2(Math.abs(c.ecart)/60)+' h')}${row('Dont dimanches (+'+num(PD.d)+' %)',hm(c.sun))}${row('Dont jours fériés (× '+n2(num(PD.f)||2)+')',hm(c.fer))}${row('Heures supplémentaires, semaines complètes ('+(c.ft?'+'+num(CM.h1)+' % puis +'+num(CM.h2)+' %':'temps partiel : à vérifier')+')',hm(c.hs1)+(c.hs2?' + '+hm(c.hs2):''))}${row('<b>Heures à payer (majorations comprises)</b>',n2(c.paid)+' h')}${c.r?row('<b>Salaire brut estimé</b> ('+n2(c.r)+' € / h)',n2(c.brut)+' €'):''}</table>${c.part?`<p class="m"><small>${c.part} semaine(s) à cheval sur deux mois : leurs heures supplémentaires ne sont pas comptées ici, à régler à la fin de la semaine.</small></p>`:''}<p class="m"><small>Estimation à vérifier : elle ne tient pas compte des congés payés, primes, absences ni des charges.</small></p>`}
function cmTot(){const p=cmP();if(!p)return;cmDays(CM.m).forEach(d=>{const e=$('#mt_'+d);if(e)e.textContent=gm(p.id,d)?hm(gm(p.id,d)):''});const s=$('#cmsum');if(s)s.innerHTML=cmSumHtml(p)}
function cmSet(d,f,v){const p=cmP(),e=((S[plk(d)]||{}).e||{})[p.id+'|'+d]||{};psw(p.id,d,{[f]:v,...(v&&!e.s?{s:'Travail'}:{})});cmTot()}
function cmC(d,v){const p=cmP();setC(p.id,d,v)}
function cmMonth(v){if(v){CM.m=v;CM.imp=null;CM.msg='';draw()}}
function cmCopy(){const p=cmP(),c=cmCalc(p),t=`Heures de ${p.name} – ${cmMon(CM.m)}\n`+c.W.map(x=>`Semaine du ${fd(x.inM[0])} : ${hm(x.mm)} (${n2(x.mm/60)} h)`).join('\n')+`\nTotal : ${hm(c.tot)} = ${n2(c.tot/60)} h\nHeures à payer (majorations comprises) : ${n2(c.paid)} h${c.r?`\nSalaire brut estimé : ${n2(c.brut)} €`:''}`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Récapitulatif copié'),()=>toast('Copie impossible : sélectionne le tableau'))}
function cmLoadJs(u){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>ko(new Error('js'));document.head.appendChild(s)})}
async function cmPdf(f,P){const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';if(!window.pdfjsLib){await cmLoadJs(B+'pdf.min.js');if(!window.pdfjsLib)throw new Error('pdfjs')}window.pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';
 const doc=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,n=Math.min(doc.numPages,8);let tx='';const pg=[];for(let i=1;i<=n;i++){const p=await doc.getPage(i);const t=await p.getTextContent();tx+=t.items.map(x=>x.str).join(' ')+'\n';pg.push(p)}
 if(tx.replace(/\s/g,'').length>150)return {text:tx.slice(0,20000)};const im=[];for(const p of pg){const v=p.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;im.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))}return {images:im}}
async function cmImp(f){const P=cmP();if(!f||!P)return;if(!rowOk2(P,CM.m+'-01')&&!canE(P))return toast('Tu ne peux pas modifier ce planning');const sp=await CU('sample');if(!sp)return toast('Lecture automatique indisponible : remplis à la main');
 CM.busy=1;CM.imp=null;CM.msg='⏳ Lecture du fichier…';draw();
 try{let src,isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);if(isPdf)src=await cmPdf(f,P);else src={images:[f]};
  const lim=await sp.limits().catch(()=>null);if(src.images&&!(lim&&lim.images))throw new Error('noimg');if(src.images&&lim&&lim.images.maxCount)src.images=src.images.slice(0,lim.images.maxCount);
  const q=`Document d’horaires de travail de « ${P.name} » dans une boulangerie-pâtisserie, pour ${cmMon(CM.m)} (${CM.m}). ${src.text?'Texte du document : « '+src.text+' ».':'Le document est en image.'} Extrais, pour chaque jour du mois qui apparaît, les horaires. Réponds uniquement par un tableau JSON : [{"d":"AAAA-MM-JJ","s":"Travail|Repos|CP|Maladie|École|","m1":"HH:MM","m2":"HH:MM","a1":"HH:MM","a2":"HH:MM"}]. Heures en 24 h. Matin = m1 à m2, après-midi = a1 à a2. Si une seule plage continue est indiquée sans pause, mets le début dans m1 et la fin dans m2. Mets "" pour ce qui n’est pas indiqué. Les jours de repos ont s="Repos" et pas d’horaire. Ne garde que les dates du mois ${CM.m}. N’invente rien.`;
  const r=await sp.json(q,{cache:false,...(src.images?{images:src.images}:{})});
  const ok=(Array.isArray(r)?r:[]).filter(x=>x&&typeof x.d=='string'&&x.d.startsWith(CM.m)&&okd(x.d)).map(x=>{const t=v=>{const m=/^(\d{1,2})[:h](\d{2})$/.exec(String(v||'').trim());return m?m[1].padStart(2,'0')+':'+m[2]:''};const o={d:x.d,s:['Repos','CP','Maladie','École','Travail'].includes(x.s)?x.s:'',m1:t(x.m1),m2:t(x.m2),a1:t(x.a1),a2:t(x.a2)};if(!o.s&&(o.m1||o.a1))o.s='Travail';return o}).filter(o=>o.s||o.m1||o.a1);
  CM.imp=ok;CM.msg=ok.length?'':'Aucun horaire reconnu pour ce mois : essaie une photo plus nette.'}catch(e){CM.msg=e.message=='noimg'?'La lecture d’images n’est pas disponible ici : remplis à la main.':'Lecture impossible : essaie une photo ou un PDF plus net, ou remplis à la main.'}
 CM.busy=0;draw()}
async function cmApply(){const P=cmP(),l=CM.imp||[];if(!P||!l.length)return;await Promise.all(cmKeys(CM.m).map(ld));let n=0;l.forEach(o=>{if(!rowOk2(P,o.d))return;psw(P.id,o.d,{s:o.s,m1:o.m1,m2:o.m2,a1:o.a1,a2:o.a2});n++});CM.imp=null;CM.msg=n?`✅ ${n} jour(s) ajouté(s) au planning de ${P.name}. Vérifie les horaires ci-dessous.`:'Aucun jour n’a pu être modifié (planning verrouillé ?).';await save();draw()}
function cmBlock(){const P=cmP();if(!P)return '<div class="card"><b>⏱️ Heures du mois</b><p class="m">Aucun salarié à afficher. Ouvre le Planning pour créer l’équipe.</p></div>';cmKeys(CM.m).forEach(sub);
 const days=cmDays(CM.m),T3=TPL(),wks=[...new Set(days.map(d=>mon(d)))],pr=me.lv>0;let rows='';
 wks.forEach(w=>{const ds=days.filter(d=>mon(d)==w);rows+=`<div class="wh">Semaine du ${fd(ds[0])} au ${fd(ds[ds.length-1])}</div>`+ds.map(d=>{const e=((S[plk(d)]||{}).e||{})[P.id+'|'+d]||{},ok=rowOk2(P,d),dz=ok?'':' disabled',k=cmKind(d),hl=hol(+d.slice(0,4))[d.slice(5)];
  return `<div class="mr${wd(d)>4?' we':''}"><span class="md"><b>${DN[wd(d)]} ${d.slice(8)}</b>${hl&&hl.k=='f'?'<small>férié</small>':''}</span><select${dz} onchange="cmC('${d}',this.value)">${optH(cur(e),T3)}</select>${[['m1','Matin de'],['m2','à'],['a1','Après-midi de'],['a2','à']].map(([f,l])=>`<label class="tl2"><small>${l}</small><input type="time"${dz} value="${e[f]||''}" onchange="cmSet('${d}','${f}',this.value)"></label>`).join('')}<b id="mt_${d}" class="mtt">${gm(P.id,d)?hm(gm(P.id,d)):''}</b></div>`}).join('')});
 return `<div class="card plz"><b>⏱️ Heures du mois (base 60 minutes)</b><p class="m" style="margin:4px 0">Choisis le salarié et le mois, remplis les horaires (4 à 5 semaines) ou joins son planning en PDF ou en photo : tout est calculé en dessous.</p>
 <div class="bar"><select onchange="CM.pid=this.value;CM.imp=null;CM.msg='';draw()" style="width:auto">${visP().map(p=>`<option value="${p.id}" ${p.id==P.id?'selected':''}>${h(p.name)}</option>`).join('')}</select><input type="month" value="${CM.m}" style="width:auto" onchange="cmMonth(this.value)"><button class="b" onclick="$('#cmf').click()">📎 Joindre un PDF ou une photo</button><input id="cmf" type="file" accept="application/pdf,image/*" hidden onchange="cmImp(this.files[0]);this.value=''"></div>
 ${CM.msg?`<p class="m">${CM.msg}</p>`:''}${CM.imp&&CM.imp.length?`<div class="card" style="border:2px solid #22c55e"><b>Horaires lus pour ${h(P.name)} : ${CM.imp.length} jour(s)</b><div class="cmt2">${CM.imp.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(o=>`<span>${DN[wd(o.d)]} ${o.d.slice(8)} : ${o.m1||o.a1?h([o.m1&&o.m1+'–'+o.m2,o.a1&&o.a1+'–'+o.a2].filter(Boolean).join(' / ')):h(o.s)}</span>`).join('')}</div><div class="bar"><button class="b" onclick="cmApply()">✔ Remplir le planning avec ces horaires</button><button onclick="CM.imp=null;draw()">Annuler</button></div></div>`:''}
 <div class="mr mh"><span>Jour</span><span>Horaire</span><span>Matin début</span><span>Matin fin</span><span>Après-midi début</span><span>Après-midi fin</span><span>Total</span></div>${rows}</div>
 <div class="card plz"><b>🧾 Calcul pour ${h(P.name)} · ${cmMon(CM.m)}</b><div class="g2" style="margin:6px 0"><div><label>Taux horaire brut (€)</label><input value="${h(CM.rate)}" ${pr?'':'disabled'} onchange="CM.rate=this.value;cmTot()"></div><div><label>Heures de contrat par semaine</label><input value="${h(P.hrs||'')}" placeholder="35" ${me.lv>1?'':'disabled'} onchange="ed('team',L('team').indexOf(cmP()),'hrs',this.value);cmTot()"></div><div><label>Heures sup. : 1res heures (%)</label><input value="${CM.h1}" onchange="CM.h1=this.value;cmTot()"></div><div><label>Heures sup. : suivantes (%)</label><input value="${CM.h2}" onchange="CM.h2=this.value;cmTot()"></div></div><div id="cmsum">${cmSumHtml(P)}</div><div class="bar"><button onclick="cmCopy()">📋 Copier le récapitulatif</button></div></div>`}
V.cal=()=>cmBlock()+`<h3 style="margin:14px 0 6px">Calculette rapide (une semaine)</h3>`+'<div class="plz">'+cm0()+'</div>';

login();
</script>
